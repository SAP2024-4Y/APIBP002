services:
  app:
    build: .
    image: apibp002-shopmesh:latest
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - JWT_SECRET=shopmesh-demo-secret-change-in-prod
    # No volume is mounted on purpose: the SQLite database lives inside the
    # container and is recreated + reseeded on every `up`, so `down` then `up`
    # is always clean and idempotent.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
